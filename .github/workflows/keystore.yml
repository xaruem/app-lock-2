name: Create keystore (run once)
on: workflow_dispatch
jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore and secrets file
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -keystore sim-menu.jks -storetype PKCS12 \
            -alias simmenu -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=sim-menu" >/dev/null 2>&1
          {
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_PASSWORD=$PASS"
            echo "KEY_ALIAS=simmenu"
            echo "KEYSTORE_BASE64=$(base64 -w0 sim-menu.jks)"
          } > secrets.txt
      - uses: actions/upload-artifact@v4
        with:
          name: keystore-secrets
          path: secrets.txt
          retention-days: 1
